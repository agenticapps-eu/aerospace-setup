# ═══════════════════════════════════════════════════════════════════════
# AeroSpace — Donald
#
# LG ULTRAWIDE 3440×1440  (oben)        → Workspace 1, und nur 1
# Odyssey G93SC 5120×1440 (unten, Main) → Workspace 2 · 3 · 4 · 5 · 6 · 7
#
#   1 DEV            Ghostty (herdr lokal) │ iTerm (herdr Mac mini)  ← LG
#   2 DISCOVER       Zen │ Claude │ Raindrop ⁄ Reader
#   3 WORK           Dia │ Slack  │ Google Meet
#   4 KOMMUNIKATION  WhatsApp │ Teams (nur Hauptfenster)
#   5 HOMELAB        cmux: hermes ⁄ homelab │ ForkLift │ Chrome
#   6 TOOLS          Obsidian │ Superlist │ iA Writer │ CotEditor
#   7 ABLAGE         frei — was gerade irgendwohin muss
#
# WARUM der LG nur EINEN Workspace hat:
# AeroSpace parkt Fenster unsichtbarer Workspaces in einer unteren Ecke
# ihres Monitors. Unter dem LG liegt echter Bildschirm (der Odyssey), also
# wurden geparkte LG-Fenster dort sichtbar — gemessen: 896 px breiter
# Streifen. Der untere Monitor hat das Problem nie, weil unter ihm nichts
# ist. Mit nur einem Workspace auf dem LG ist dort nie etwas versteckt,
# und das Problem existiert nicht mehr. Deshalb liegt alles Umschaltbare
# unten auf dem Odyssey.
#
# Liegt als Symlink unter ~/.config/aerospace/aerospace.toml (install.sh)
# ═══════════════════════════════════════════════════════════════════════

config-version = 2

start-at-login = true

# Config wird beim Speichern automatisch neu geladen (seit v0.21.0).
# Einmal manuell mit alt-shift-; esc neu laden, dann greift es.
auto-reload-config = true

# Farbiger Rahmen ums fokussierte Fenster. JankyBorders v1.9.0 ist bei dir
# schon installiert (stand auch in deiner alten Config vom Dezember).
# borders erkennt selbst, ob es schon läuft — kein doppelter Start.
after-startup-command = [
  'exec-and-forget borders active_color=0xff7dd3fc inactive_color=0x00000000 width=6.0',
]

# ── Tiling-Grundverhalten ──────────────────────────────────────────────
# Auf Ultrawides ist horizontal immer richtig: neue Fenster reihen sich
# nebeneinander ein, nicht übereinander.
default-root-container-layout      = 'tiles'
default-root-container-orientation = 'horizontal'

# Erste Zeile räumt verschachtelte 1-Kind-Container auf.
# Zweite Zeile ist der Grund, warum die geteilte dritte Spalte auf
# Workspace 2 funktioniert: ein Container innerhalb eines horizontalen
# Roots wird automatisch vertikal.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 40

# ── Maus und Fokus müssen PAARWEISE konfiguriert werden ────────────────
# Mit focus-follows-mouse allein passiert Folgendes: du springst per
# Tastatur in ein anderes Fenster, die Maus bleibt aber liegen wo sie war
# — und zieht den Fokus sofort dorthin zurück. Das Gegenstück ist dieser
# Callback: bei jedem Fokuswechsel wandert der Cursor in die Mitte des
# neuen Fensters.
#
# "lazy" heisst: nur bewegen, wenn der Cursor nicht schon im Fenster ist.
# Damit ruckelt die Maus nicht bei jedem Klick innerhalb desselben
# Fensters herum.
# ABGESCHALTET am 23.09.2026. Gemessen: der Zeiger sprang bei jedem
# Fokuswechsel fast 1000 px weit (2390,1359 → 1409,734 → 2692,734).
#
# Der Callback war das Gegenstueck zu AeroSpaces eigenem
# focus-follows-mouse. Das steht seit August auf false, weil AutoRaise
# die Aufgabe uebernommen hat — seitdem hatte er keine Funktion mehr und
# richtete nur Schaden an:
#
#   AutoRaise fokussiert das Fenster unter dem Zeiger  →  AeroSpace
#   teleportiert den Zeiger in dessen Mitte  →  das ist eine Bewegung,
#   also prueft AutoRaise erneut  →  ggf. anderes Fenster, naechster
#   Sprung. Sekundenlanges Ping-Pong, bis es sich einpendelt.
#
# Und faellt so ein Sprung zwischen Maus-runter und Maus-hoch, wertet
# macOS das als ZIEHEN statt Klicken — in Slack wurde damit der Chat
# verschoben statt ausgewaehlt.
# on-focus-changed = ['move-mouse window-lazy-center']

# Dasselbe auf Monitorebene, als Netz für den Fall, dass kein Fenster
# fokussiert ist (window-lazy-center scheitert dann).
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Fokus folgt der Maus — AUS, das macht AutoRaise. Warum:
#
# AeroSpace kennt hier genau einen Schalter. Nachgesehen im Quelltext,
# Sources/AppBundle/config/parseFocusFollowsMouse.swift:
#
#     private let focusFollowsMouseParserTable: [...] = [
#         "enabled": Parser(\.enabled, parseBool),
#     ]
#
# Kein delay, keine Verweildauer, keine App-Ausnahmen. Die Umsetzung
# hängt an einem globalen .mouseMoved-Monitor und feuert bewusst ohne
# Timer; ausserdem ruft sie nativeFocus(), hebt das Fenster also an.
# Bei gestapelten Monitoren heisst das: Cursor über die Kante zwischen
# LG und Odyssey, und der Fokus springt sofort mit.
#
# AutoRaise 5.6.1 kann beides besser: 250 ms Verweildauer, und im
# Focus-First-Build fokussieren OHNE anzuheben — beim Tiling überlappt
# ohnehin nichts, Anheben wäre sinnlose Bewegung.
#     /Applications/AutoRaise.app  ·  -delay 0 -focusDelay 6
focus-follows-mouse.enabled = false

# Apps, die macOS versteckt hat (cmd-h), wieder einblenden statt ignorieren.
automatically-unhide-macos-hidden-apps = true

key-mapping.preset = 'qwerty'

# Workspaces bleiben bestehen, auch wenn leer — sonst klappt ein leerer
# Workspace von seinem Monitor weg.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7']

# ── Gaps ───────────────────────────────────────────────────────────────
# Gaps kosten fast nichts: bei 3 Fenstern auf dem Odyssey (5120 px)
# frisst 16 statt 8 px nur ~11 px Breite pro Fenster — 0,6 %.
# Der breitere Monitor bekommt grössere Gaps, damit sie auf beiden
# Panels optisch gleich wirken.
gaps.inner.horizontal = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
gaps.inner.vertical   = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
gaps.outer.left       = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
gaps.outer.right      = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
gaps.outer.top        = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
gaps.outer.bottom     = [{ monitor."odyssey" = 16 }, { monitor."lg" = 12 }, 12]
# Zu luftig? alle auf 8. Noch luftiger? 24 / 20.

# ═══════════════════════════════════════════════════════════════════════
# STANDARD-PLATZIERUNG
# ═══════════════════════════════════════════════════════════════════════
# Die erste passende Regel gewinnt — Reihenfolge zählt.
# Regeln mit `&&` müssen VOR der allgemeinen Regel derselben App stehen.
on-window-detected = [
  # ╔═ AeroPilot ═══ automatisch verwaltet ═══
  # In AeroPilot gesetzt: Fenster dieser Apps floaten immer.
  # Von Hand hier nichts ändern — die App ersetzt den Block ganz.
  #
  # check-further-callbacks: floaten UND die Regeln darunter
  # weiterhin durchlaufen. Ohne das gewönne diese Regel als erste
  # passende, und die Workspace-Zuordnung fiele aus.
  { if = 'test %{app-bundle-id} = app.tagwerk.tagwerk', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.BZG.CoherenceX5', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.BZG.CoherenceX6', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.AppStore', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.dygmalab.bazecor', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.electron.wispr-flow', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.granola.app', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.hegenberg.BetterTouchTool', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.runningwithcrayons.Alfred-Preferences', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = iordv.Droppy', check-further-callbacks = true, run = 'layout floating' },
  { if = 'test %{app-bundle-id} = org.localsend.localsendApp', check-further-callbacks = true, run = 'layout floating' },
  # ╚═ Ende AeroPilot ═══════════════════════



  # Route after synchronous callbacks using the same hardware policy as relayout.
  { check-further-callbacks = true, run = 'exec-and-forget python3 "$HOME/.config/aerospace/env/layout.py" window' },

  # ── Hilfsfenster: floaten, wo sie aufgehen ──────────────────────────
  # BEWUSST AUSSERHALB des AeroPilot-Blocks. Die App ersetzt ihren Block
  # komplett; was dort von Hand hineingeschrieben wird, ist beim nächsten
  # Speichern weg.
  #
  # Kein `check-further-callbacks` und keine Workspace-Zuordnung: diese
  # Fenster sollen genau dort floaten, wo sie geöffnet werden. Ein
  # Finder-Fenster, das man aus einem Workspace heraus aufmacht, gehört
  # in diesen Workspace — nicht in einen fest zugewiesenen anderen.
  { if = 'test %{app-bundle-id} = com.apple.finder',             run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.obsbot.OBSBOT_Center',     run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.systempreferences',  run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.noodlesoft.Hazel',         run = 'layout floating' },
  # Boring Notch ist ein Overlay fuer die Notch, kein Fenster im
  # eigentlichen Sinn. Am 13.10.2026 aufgenommen, weil es beim
  # Massen-Zuruecksetzen auf `tiling` mitgekachelt wurde und dann als
  # normales Fenster im Raster lag.
  { if = 'test %{app-bundle-id} = theboringteam.boringnotch',    run = 'layout floating' },

  # Kontor, solange es entwickelt wird. Gehört hierher und nicht in den
  # AeroPilot-Block: Der Entwurf wird mehrmals täglich neu gebaut, und eine
  # gekachelte Fensterhöhe von 1377 px sagt nichts darüber aus, wie die App
  # aussieht. Ist sie fertig, kann die Regel nach AeroPilot wandern.
  { if = 'test %{app-bundle-id} = eu.agenticapps.kontor',        run = 'layout floating' },













  # ── Immer floaten: Dialoge, Utilities, Passwortmanager ──────────────
  { if = 'test %{app-bundle-id} = com.1password.1password',     run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = pl.maketheweb.cleanshotx',    run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.goodsnooze.MacWhisper',   run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.finder',            run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.Preview',           run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.macpaw.CleanMyMac5',      run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.elgato.StreamDeck',       run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.manytricks.Moom',         run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.macility.typinator2',     run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.kagi.kagimacOS',          run = 'layout floating' },   # Orion

  # ── Installer, Updater, Modale ───────────────────────────────────────
  # AeroSpace erkennt die meisten davon schon selbst als Dialog und
  # floatet sie (Fenster ohne Vollbild-Button gelten als Dialog). Hier
  # nur, was die Heuristik erfahrungsgemäss übersieht.
  { if = 'test %{app-bundle-id} = com.apple.installer',       run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.SoftwareUpdate',  run = 'layout floating' },
  # Sparkle-Updater laufen im Prozess der App selbst, sind also nicht über
  # die Bundle-ID zu treffen. Deshalb ein ANGEKERTES Titelmuster: es muss
  # der ganze Titel passen, sonst würde ein Browserfenster namens
  # "Update your profile — Chrome" mitfloaten.
  { if = "test %{window-title} ~= '^(Installer|Setup|Software.?Update|Updating.*)$'",
    run = 'layout floating' },

  # ── Grafik & Medien: brauchen Canvas + freie Paletten ───────────────
  { if = 'test %{app-bundle-id} = com.pixelmatorteam.pixelmator.x',             run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.pixelmatorteam.pixelmator.touch.x.photo', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.canva.affinity',          run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.colliderli.iina',         run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.firecore.infuse',         run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.charliemonroe.Permute-3',  run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.edovia.screens.5',        run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.iWork.Keynote',     run = 'layout floating' },

  # Workspace routing lives exclusively in env/layout*.conf.
  # Keep meeting popup floating behavior separate from placement.
  { if = "test %{app-bundle-id} = com.microsoft.teams2 && test-not %{window-title} ~= '^(Activity|Chat|Teams|Calendar|Calls|Files|Apps|Aktivität|Chats|Kalender|Anrufe|Dateien)'",
    run = 'layout floating' },
  { if = 'test %{app-bundle-id} = us.zoom.xos', run = 'layout floating' },

]

# ═══════════════════════════════════════════════════════════════════════
# MONITOR-ZUORDNUNG
# ═══════════════════════════════════════════════════════════════════════
# Monitor-Pattern = case-insensitive Regex auf den Monitornamen.
# Bewusst keine Nummern: AeroSpace numeriert von links nach rechts, was
# bei gestapelten Monitoren ambig ist und sich beim Verschieben in
# "Anordnen…" ändert. Namen sind stabil.
[workspace-to-monitor-force-assignment]
# Arrays statt einzelner Muster: die ERSTE passende Regel gewinnt, der
# Rest ist Rückfallebene. Hängt kein externer Monitor dran — Laptop
# unterwegs —, greift 'built-in' und alle Workspaces landen auf dem
# eingebauten Schirm. Ohne diese Rückfallebene bleibt eine Zuordnung auf
# einen fehlenden Monitor stehen, und Workspaces sind schlimmstenfalls
# nicht mehr erreichbar (AeroSpace-Issue #651).
#
# AeroPilot ruft beim Start und nach Monitoränderungen den gemeinsamen
# Profilhandler auf. alt-ctrl-m gleicht das Hardwareprofil manuell ab.
# ⚠️ NIE wieder 'odyssey' als Muster (12.10.2026). Seit der zweite
# Samsung da ist, heissen BEIDE Monitore "Odyssey …" — 'odyssey' traf
# damit auch den kleinen G61SH, AeroSpace nimmt den ersten Treffer, und
# der gesamte Arbeitsbereich landete auf dem 27-Zoeller statt auf dem
# 49er. Muster muessen das Modell nennen, nicht die Produktlinie.
#
# Aufbau links → rechts: G61SH (27", 2560) · G93SC (49", 5120) · intern.
#
# Die Ketten sind Rueckfallebenen, erste passende Regel gewinnt:
#   1 → kleiner Samsung, sonst grosser, sonst eingebaut
#   4 → eingebauter Schirm (nur Slack und WhatsApp), sonst grosser
#   Rest → grosser Samsung, sonst kleiner, sonst eingebaut
# Damit bleibt jede Teilmenge der drei Monitore bedienbar; ohne
# Rueckfallebene kleben Workspaces an einem fehlenden Monitor und sind
# schlimmstenfalls unerreichbar (AeroSpace-Issue #651).
1 = ['g61sh', 'g93sc', 'built-in', 'main']
2 = ['g93sc', 'g61sh', 'built-in', 'main']
3 = ['g93sc', 'g61sh', 'built-in', 'main']
4 = ['built-in', 'g93sc', 'g61sh', 'main']
5 = ['g93sc', 'g61sh', 'built-in', 'main']
6 = ['g93sc', 'g61sh', 'built-in', 'main']
7 = ['g93sc', 'g61sh', 'built-in', 'main']

# ═══════════════════════════════════════════════════════════════════════
# KEYBINDINGS
# ═══════════════════════════════════════════════════════════════════════
[mode.main.binding]

  # ⚠️  TASTATURLAYOUT — die Falle, wenn du zwischen deinen beiden
  #     Belegungen wechselst
  #
  # AeroSpace liest Tasten IMMER als physische QWERTY-Positionen. Aus der
  # Doku: „By default, key bindings in the config are perceived as qwerty
  # layout." Presets gibt es nur für dvorak und colemak, keins für Deutsch.
  #
  # EurKEY hat eine US-QWERTY-Basis, dort stimmt alles. Auf der DEUTSCHEN
  # Belegung wandern diese Bindings auf andere Tasten:
  #
  #     Config                  EurKEY   Deutsch
  #     alt-slash               /        -      ← kippt die Ausrichtung!
  #     alt-minus               -        ß
  #     alt-equal               =        ´
  #     alt-shift-semicolon     ;        ö
  #
  # Die erste Zeile ist die gefährliche: auf Deutsch liegt „Ausrichtung
  # kippen" auf alt + „-" — also genau der Taste, die man drückt, wenn man
  # die Grösse ändern oder eine Spalte teilen will. Ein Anschlag, ganzer
  # Workspace gedreht, kein Rückgängig. Zurück geht es mit alt-ctrl-2
  # (Workspace 2) bzw. alt-b und alt-shift-minus von Hand.
  #
  # Wenn du dauerhaft auf Deutsch umsteigst: hier die Notationen tauschen,
  # nicht die Tasten suchen.

  # ── Layout ────────────────────────────────────────────────────────────
  alt-slash   = 'layout tiles horizontal vertical'
  alt-comma   = 'layout accordion horizontal vertical'
  alt-f       = 'fullscreen'
  alt-shift-f = 'layout floating tiling'
  alt-b       = 'balance-sizes'

  # Spalte vertikal teilen / zusammenfassen — baut die geteilte dritte
  # Spalte auf Workspace 4 von Hand nach.
  alt-shift-minus = 'join-with left'
  alt-shift-equal = 'join-with right'

  # ═══ EBENE 1 · ctrl + Pfeil = WORKSPACE / DISPLAY ══════════════════════
  # Genau die Bedeutung, die Mission Control vorher hatte:
  #   links/rechts = Space wechseln  →  jetzt Workspace wechseln
  #   hoch/runter  = Monitor wechseln (oben LG, unten Odyssey)
  #
  # VORAUSSETZUNG: die Mission-Control-Kürzel müssen abgeschaltet sein,
  # sonst gewinnt macOS und AeroSpace sieht die Tasten nie:
  #   ~/.config/aerospace/macos/mission-control-keys.sh off
  #
  # `workspace prev/next` blättert nur die Workspaces des Monitors, auf
  # dem du gerade bist — 1→2→3 oben, 4→5→6 unten.
  # ⚠️ Nicht direkt `workspace --wrap-around next` (12.10.2026): das
  # blaettert nur die Workspaces des AKTUELLEN Monitors. Seit zwei der
  # drei Monitore genau einen Workspace tragen (G61SH → 1, intern → 4)
  # war die Taste dort wirkungslos — gemessen: drei Druecke, Fokus blieb
  # auf 4. ws-cycle.sh behaelt das Verhalten bei und rutscht nur dann auf
  # den naechsten Monitor weiter, wenn es sonst nicht weitergeht.
  ctrl-left  = 'exec-and-forget ~/.config/aerospace/env/ws-cycle.sh prev'
  ctrl-right = 'exec-and-forget ~/.config/aerospace/env/ws-cycle.sh next'

  # ⚠️ KEINE Monitornamen mehr (12.10.2026). Hier stand `focus-monitor lg`
  # bzw. `odyssey`. Als der LG abgebaut wurde, zeigte ctrl-↑ auf ein Gerät,
  # das es nicht mehr gibt: AeroSpace meldet "None of the monitors match
  # the pattern(s)" und endet trotzdem mit **Exit-Code 0** — die Bindung
  # scheitert also lautlos. Ein Name ist eine Wette darauf, dass die
  # Hardware gleich bleibt.
  #
  # `next`/`prev` haengt an gar keinem Namen und kann deshalb nie ins Leere
  # zeigen. Bei zwei Monitoren schalten ↑ und ↓ beide zum jeweils anderen.
  #
  # Warum hier nicht `up`/`down`: AeroSpace rechnet Richtungen in einem
  # Koordinatensystem, in dem y nach unten waechst. Als der Odyssey
  # Hauptbildschirm wurde, lag der darueber stehende LG intern bei y=1440
  # und galt damit als "unten" — ctrl-↑ fuehrte nach unten. Auf der
  # waagerechten Achse gibt es diese Falle nicht, deshalb duerfen die
  # ctrl-alt-Bindungen unten sehr wohl `left`/`right` benutzen.
  ctrl-up    = 'focus-monitor --wrap-around prev'
  ctrl-down  = 'focus-monitor --wrap-around next'

  # ═══ MONITOR WECHSELN · ctrl-alt + Pfeil ═══════════════════════════════
  # Seit die Monitore NEBENEINANDER stehen (MacBook rechts vom Samsung,
  # x=0 bzw. x=5120) ist links/rechts die natuerliche Geste dafuer.
  # ctrl + ←/→ ist schon fuer Workspaces vergeben, ctrl-alt + Pfeil war in
  # allen 275 erfassten Kuerzeln dieser Maschine frei.
  #
  # NICHT Hyper + Pfeil: das schickt in Ghostty \x02h/\x02l und ist die
  # herdr-Pane-Navigation. Globale Hotkeys greifen vor App-Keybinds, eine
  # Bindung hier wuerde sie also verschlucken.
  #
  # --wrap-around, damit ← und → auch am Rand zuverlaessig auf dem anderen
  # Monitor landen statt nichts zu tun.
  ctrl-alt-left  = 'focus-monitor --wrap-around left'
  ctrl-alt-right = 'focus-monitor --wrap-around right'

  # Mit shift: das Fenster mitnehmen statt nur hinschauen.
  ctrl-shift-left  = 'move-node-to-workspace --wrap-around prev --focus-follows-window'
  ctrl-shift-right = 'move-node-to-workspace --wrap-around next --focus-follows-window'
  # Dieselbe Umstellung wie oben: keine Monitornamen, sonst zeigen auch
  # diese beiden ins Leere, sobald sich die Hardware aendert.
  ctrl-shift-up    = 'move-node-to-monitor --wrap-around prev --focus-follows-window'
  ctrl-shift-down  = 'move-node-to-monitor --wrap-around next --focus-follows-window'

  # Fenster auf den Monitor nebenan — Gegenstueck zu ctrl-alt + Pfeil.
  ctrl-alt-shift-left  = 'move-node-to-monitor --wrap-around left --focus-follows-window'
  ctrl-alt-shift-right = 'move-node-to-monitor --wrap-around right --focus-follows-window'

  # ═══ EBENE 2 · alt + Pfeil = FENSTER IM WORKSPACE ══════════════════════
  # Zwischen den Apps innerhalb eines Workspace springen.
  #
  # Kleingedrucktes: alt-←/→ ist auf macOS die Wortweise-Navigation im
  # Text, alt-shift-←/→ die Wortweise-Auswahl. AeroSpace greift global,
  # du verlierst das also in Obsidian, iA Writer und CotEditor. Wenn dich
  # das beim Schreiben stört: hier alt- durch alt-ctrl- ersetzen.
  alt-left  = 'focus left'
  alt-down  = 'focus down'
  alt-up    = 'focus up'
  alt-right = 'focus right'

  # Mit shift: das Fenster im Raster umsortieren.
  alt-shift-left  = 'move left'
  alt-shift-down  = 'move down'
  alt-shift-up    = 'move up'
  alt-shift-right = 'move right'

  # ── Größe ─────────────────────────────────────────────────────────────
  alt-minus = 'resize smart -100'
  alt-equal = 'resize smart +100'

  # ── Workspaces ────────────────────────────────────────────────────────
  # 1–3 liegen auf dem LG (oben), 4–6 auf dem Odyssey (unten).
  alt-1 = 'workspace 1'
  alt-2 = 'workspace 2'
  alt-3 = 'workspace 3'
  alt-4 = 'workspace 4'
  alt-5 = 'workspace 5'
  alt-6 = 'workspace 6'
  alt-7 = 'workspace 7'
  alt-tab = 'workspace-back-and-forth'

  alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
  alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
  alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
  alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
  alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
  alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
  alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'

  # ── Monitor-Wechsel: ctrl-↑ / ctrl-↓ ──────────────────────────────────
  # KEIN alt-o / alt-shift-o mehr. Auf einer Tastatur, auf der Umlaute
  # über opt+a/o/u entstehen, würde alt-o das ö kaputtmachen.
  # Aus demselben Grund sind alt-a und alt-u nirgends belegt.

  # ── Aufbau ────────────────────────────────────────────────────────────
  # Baut das komplette Setup: Ghostty-Fenster mit Tabs, alle Apps,
  # beide Monitore. Einmal morgens.
  alt-ctrl-a = 'exec-and-forget ~/.config/aerospace/env/build-all.sh'

  # m wie mobil. Umgekehrte Richtung: zurück an den Schreibtisch mit
  # alt-ctrl-a, das baut das Zwei-Monitor-Layout ohnehin neu auf.
  alt-ctrl-m = 'exec-and-forget ~/.config/aerospace/env/laptop.sh'

  # w wie Wechsel. Nach dem An-/Abstecken eines Monitors drücken.
  # Schaltet KEINEN Modus um — die Verteilung steht deklarativ in
  # workspace-to-monitor-force-assignment. Sagt AeroSpace nur, dass es
  # nochmal hinschauen soll (reload + relayout).
  alt-ctrl-w = 'exec-and-forget ~/.config/aerospace/env/monitorwechsel.sh'
  # Ghostty — EIN Fenster pro Zweck, keine Tabs.
  # Native macOS-Tabs sind einzelne Fenster in einer Gruppe; AeroSpace
  # kachelt Gruppenmitglieder und macOS reisst sie dabei heraus. Deshalb
  # umgeschaltet wird mit AeroSpace, nicht mit Ghostty-Tabs.
  alt-ctrl-1 = 'exec-and-forget ~/.config/aerospace/env/ghostty-herdr.sh'
  # iTerm mit herdr auf dem Mac mini, cmux mit hermes und homelab.
  # Ghostty gibt es nur noch fuer herdr lokal (alt-ctrl-1).
  alt-ctrl-3 = 'exec-and-forget ~/.config/aerospace/env/it.sh'
  alt-ctrl-5 = 'exec-and-forget ~/.config/aerospace/env/homelab.sh'
  # Nur die Layouts richten (r = relayout).
  # Bewusst nicht alt-ctrl-l — zu nah an alt-ctrl-left.
  alt-ctrl-r = 'exec-and-forget ~/.config/aerospace/env/relayout.sh'

  # Workspace 2 exakt wiederherstellen: Zen │ Claude │ Raindrop ⁄ Reader.
  #
  # WOZU EINE EIGENE TASTE: Am 20.08.2026 war die Wurzel von Workspace 2
  # auf vertikal gekippt — vier Bänder übereinander statt drei Spalten —
  # und die Verschachtelung von Raindrop und Reader aufgelöst. Das Skript
  # liest die Baumreihenfolge, sortiert, fasst Reader mit Raindrop
  # zusammen und gleicht aus. Ein Anschlag statt Terminal.
  alt-ctrl-2 = 'exec-and-forget ~/.config/aerospace/env/discover-layout.sh'

  # ── Service-Modus ─────────────────────────────────────────────────────
  alt-shift-semicolon = 'mode service'

[mode.service.binding]
  esc       = ['reload-config', 'mode main']
  r         = ['flatten-workspace-tree', 'mode main']
  f         = ['layout floating tiling', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']
  left      = ['join-with left',  'mode main']
  down      = ['join-with down',  'mode main']
  up        = ['join-with up',    'mode main']
  right     = ['join-with right', 'mode main']
