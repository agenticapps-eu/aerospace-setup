# ══════════════════════════════════════════════════════════════════════
# SOLL-TABELLE — wo welche App hingehört
#
# EINE Quelle. Gelesen von:
#   env/relayout.sh   ordnet bereits offene Fenster ein   (alt-ctrl-r)
#   AeroPilot         meldet Abweichungen im Bereich Fenster
#
# WOZU: `on-window-detected` in der aerospace.toml greift NUR, wenn ein
# Fenster erscheint — nie rückwirkend. Als die Workspaces am 19.08.2026
# umnummeriert wurden, zogen die Regeln mit, die offenen Fenster nicht.
# Einen Tag später lagen sieben Fenster noch auf ihren alten Nummern,
# obwohl die Config längst stimmte. Diese Datei ist das Gegenmittel:
# der Soll-Zustand, jederzeit nachprüfbar und mit einem Anschlag
# herstellbar.
#
# FORMAT
#   <bundle-id>   <workspace>   [<titel-regex>]
#
#   Erste Übereinstimmung gewinnt — wie bei on-window-detected. Deshalb
#   stehen Regeln mit Titelmuster VOR der allgemeinen Regel derselben App.
#   Workspace `-` heisst: nie melden, nie verschieben.
#
#   Ein `+` vor der Bundle-ID heisst: build-all.sh öffnet diese App beim
#   Aufbau. Ohne `+` wird sie nur eingeordnet, wenn sie ohnehin läuft —
#   so bleiben Chrome (Testbrowser) und Teams (nach Bedarf) aussen vor.
# ══════════════════════════════════════════════════════════════════════

# ── 1 DEV (LG, oben) ──────────────────────────────────────────────────
+md.obsidian                      1

# ── 2 DISCOVER ────────────────────────────────────────────────────────
+app.zen-browser.zen              2
+com.anthropic.claudefordesktop   2
+io.raindrop.macapp               2
+io.readwise.read                 2

# ── 3 WORK ────────────────────────────────────────────────────────────
+company.thebrowser.dia           3
+com.tinyspeck.slackmacgap        3
# Google Meet ist eine Chrome-PWA und meldet sich als com.google.Chrome.
# Nur am Titel zu unterscheiden — deshalb VOR der Chrome-Regel.
#
# ZWEI TITEL, nicht einer. Am 20.08.2026 im laufenden Meeting gemessen:
#   Lobby / kein Anruf   „Google Meet"
#   im Anruf             „Meet – Management Huddle - Camera and microphone recording"
# Ein exaktes ^Google Meet$ hat das Fenster deshalb mitten im Meeting als
# gewöhnliches Chrome-Fenster eingestuft und nach 6 geschoben.
# `Meet( |$)` trifft beide und nicht „Meeting…" von anderen Fenstern.
com.google.Chrome                3   ^(Google )?Meet( |$)

# ── 4 COMMUNICATION ───────────────────────────────────────────────────
+net.whatsapp.WhatsApp            4
+com.fastmail.mac.Fastmail        4
# Teams: nur das Hauptfenster. Meeting-Popups floaten und tragen andere
# Titel — die würden sonst als "falscher Workspace" gemeldet.
com.microsoft.teams2             4   ^(Activity|Chat|Teams|Calendar|Calls|Files|Apps|Aktivität|Chats|Kalender|Anrufe|Dateien)
com.microsoft.teams2             -

# ── 6 TOOLS ───────────────────────────────────────────────────────────
com.google.Chrome                6

# ── 7 PRODUCTIVITY ────────────────────────────────────────────────────
+com.binarynights.ForkLift        7
+com.superlist.superlist          7

# ── bewusst NICHT zugeordnet ──────────────────────────────────────────
# Ghostty: alle Fenster teilen sich eine Bundle-ID, und TUI-Programme wie
# btop oder superfile setzen keinen Fenstertitel — herdr lokal (1), die
# Remote-Sitzungen (5) und das Terminal (6) sind darüber nicht
# auseinanderzuhalten. Platziert werden sie beim Öffnen durch gt.sh,
# das den Workspace vor dem Erzeugen fokussiert. Verschieben würde hier
# also raten, und Raten ist schlimmer als Nichtstun.
com.mitchellh.ghostty            -

# Floatende Helfer, die überall auftauchen dürfen
com.kagi.kagimacOS               -
com.ergonis.typinator            -
com.1password.1password          -
