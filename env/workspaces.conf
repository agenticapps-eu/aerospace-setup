# ══════════════════════════════════════════════════════════════════════
# WORKSPACE-NAMEN
#
# AeroSpace kennt keine Namen. Ein Workspace IST seine Kennung — "1", "2",
# … Umbenennen hiesse, die Kennung überall mitzuziehen: Config, Tasten,
# layout.conf, Skriptnamen. Deshalb stehen die Namen hier daneben, rein
# zur Anzeige.
#
# Gelesen von:
#   AeroPilot        zeigt sie und schreibt sie zurück
#   env/ws-*.sh      Beschriftung der Knöpfe
#
# FORMAT
#   <workspace>  <name>
#
# Eine Zeile pro Workspace, alles nach # ist Kommentar. AeroPilot ersetzt
# beim Speichern nur die Namenszeilen und lässt Kommentare stehen.
# ══════════════════════════════════════════════════════════════════════

1  DEV
2  DISCOVER
3  WORK
4  KOMMUNIKATION
5  HOMELAB
6  TOOLS
7  PRODUCTIVITY
