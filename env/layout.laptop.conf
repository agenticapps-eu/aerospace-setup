# Hardware-selected laptop policy; * catches all remaining apps.
# Unterwegs: Ghostty nur herdr lokal, iTerm daneben auf 1, cmux mit
# beiden Remote-Sitzungen auf 2. Ghostty sonst nicht zuordnen.
# Titelregel am 11.10.2026 entfernt, gleiche Ursache wie in layout.conf:
# herdr benennt das Fenster beim Verbinden nach Host und Sitzung um, also
# traf ^herdr$ nie und der Auffangfall '-' liess das Fenster frei wandern.
com.mitchellh.ghostty 1
+com.googlecode.iterm2 1
+com.cmuxterm.app 2
+app.zen-browser.zen 4
+com.anthropic.claudefordesktop 5
+md.obsidian 6
* 7
