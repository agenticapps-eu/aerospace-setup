# Hardware-selected laptop policy; * catches all remaining apps.
# Unterwegs: Ghostty nur herdr lokal, iTerm daneben auf 1, cmux mit
# beiden Remote-Sitzungen auf 2. Ghostty sonst nicht zuordnen.
com.mitchellh.ghostty 1 ^herdr$
com.mitchellh.ghostty -
+com.googlecode.iterm2 1
+com.cmuxterm.app 2
+app.zen-browser.zen 4
+com.anthropic.claudefordesktop 5
+md.obsidian 6
* 7
