# ══════════════════════════════════════════════════════════════════════
# layout.hybrid.conf — Abweichungen, wenn das MacBook einen der Schirme
# stellt (eingebauter Schirm PLUS externer Monitor).
#
# DIESE DATEI ERSETZT layout.conf NICHT. layout.py stellt sie voran,
# target() nimmt die erste passende Regel — also gewinnt hier Gelistetes,
# alles Uebrige kommt weiter aus layout.conf. Deshalb steht hier nur,
# was tatsaechlich anders ist. Keine zweite vollstaendige Tabelle, kein
# Auseinanderlaufen.
#
# Format identisch zu layout.conf:
#   [+]<bundle-id>  <workspace>  [titel-regex]
# ══════════════════════════════════════════════════════════════════════

# ── iTerm (herdr auf dem Mac mini) ────────────────────────────────────
# Auf dem LG (3440 breit) lag iTerm neben Ghostty auf Workspace 1. Der
# eingebaute Schirm hat logisch nur rund 1728 Punkte — geteilt bleiben
# keine 860 pro Terminal. Ghostty mit herdr bekommt hier die volle
# Breite, iTerm zieht auf den Samsung.
#
# Ziel ist 5 HOMELAB, nicht 6 TOOLS: dort liegt cmux mit den beiden
# entfernten Sitzungen (hermes, homelab) und ForkLift. iTerm bringt die
# dritte entfernte Maschine mit — alle Remote-Terminals beieinander.
# 6 TOOLS ist dagegen die Schreibecke (Obsidian, Superlist, iA Writer).
com.googlecode.iterm2            5
